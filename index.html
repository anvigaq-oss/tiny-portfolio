<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anvi's Tiny World</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="tiny-house">

    <div class="sky">
      <div class="moon">☾</div>
      <div class="star star-one">✦</div>
      <div class="star star-two">✧</div>
      <div class="star star-three">✦</div>
    </div>

    <div class="house">

      <div class="roof">
        <span>♡</span>
      </div>

      <div class="house-body">

        <div class="window left-window">
          <span>✦</span>
        </div>

        <div class="door">
          <span class="door-number">28</span>
          <span class="handle"></span>
        </div>

        <div class="window right-window">
          <span>☾</span>
        </div>

      </div>

      <div class="garden">
        🌿 🌷 🌿 🌱 🌷 🌿
      </div>

    </div>

    <div class="intro">

      <p class="welcome">WELCOME TO</p>

      <h1>Anvi's Tiny World</h1>

      <p class="description">
        A little house for my work, ideas,<br>
        experiments & things I love.
      </p>

      <button class="enter-button">
        Enter the house →
      </button>

    </div>

  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anvi's Tiny Portfolio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="tiny-house">

    <div class="sky">
      <div class="moon">☾</div>
      <div class="stars">✦　·　✧　·　✦</div>
    </div>

    <section class="house">

      <div class="roof">
        <div class="roof-line"></div>
      </div>

      <div class="house-body">

        <div class="window window-left">
          <span>✦</span>
        </div>

        <div class="front-door">
          <div class="door-number">28</div>
          <div class="door-handle"></div>
        </div>

        <div class="window window-right">
          <span>☾</span>
        </div>

      </div>

      <div class="garden">
        <span>🌿</span>
        <span>🌷</span>
        <span>🌿</span>
        <span>🌱</span>
        <span>🌷</span>
        <span>🌿</span>
      </div>

    </section>

    <section class="intro">
      <p class="small-title">WELCOME TO</p>

      <h1>Anvi's Tiny World</h1>

      <p class="description">
        A little house for my work, ideas,<br>
        experiments & things I love.
      </p>

      <button class="enter-button">
        Enter the house →
      </button>
    </section>

  </main>

</body>
</html>
